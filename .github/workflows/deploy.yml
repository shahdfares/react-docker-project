name: Docker react project 
on:
 push:
  branch:
   - master

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v2
   - run: docker login -u ${{ secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}
   - run: docker build shahd/reactproject -f Dockerfile.dev .
   - run: docker run -e CI=true  shahd/reactproject npm run test
